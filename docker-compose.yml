services:
  postgres:
    image: postgres:16-alpine
    container_name: rscb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Tigerlake.85
      POSTGRES_DB: rscb_deployment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rscb_deployment"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rscb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: rscb-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:Tigerlake.85@postgres:5432/rscb_deployment
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 24h
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      CI_API_KEY: dev-ci-key-change-in-production
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: rscb-artifacts
      MINIO_USE_SSL: false
      MINIO_PUBLIC_URL: http://localhost:9000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: rscb-web
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres-data:
  minio-data:
  uploads: