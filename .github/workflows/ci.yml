name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Backend dan web mengimport @rscb/shared yang entry point-nya
      # dist/index.js, jadi shared harus dibangun lebih dulu.
      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test backend
        run: npm run test -w apps/backend

      - name: Test web
        run: npm run test -w apps/web

  # E2E backend menuntut PostgreSQL nyata (entity memakai enum postgres).
  # Database e2e terpisah (rscb_e2e) agar data dev tidak tersentuh;
  # migration TypeORM berjalan otomatis saat module e2e start.
  e2e:
    name: E2E Backend
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rscb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run e2e
        run: npm run test:e2e -w apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rscb_e2e
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: e2e-admin-pass
          CI_API_KEY: e2e-ci-key
          JWT_SECRET: e2e-jwt-secret
          STORAGE_DRIVER: local
          UPLOAD_DIR: ./uploads-e2e

  # Build image tanpa push — memastikan Dockerfile tetap sehat setiap
  # perubahan. Publish image ke registry menyusul bila dibutuhkan.
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          tags: rscb-deployment-backend:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: rscb-deployment-web:ci
