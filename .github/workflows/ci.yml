name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Backend dan web mengimport @rscb/shared yang entry point-nya
      # dist/index.js, jadi shared harus dibangun lebih dulu.
      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Web belum punya unit test (script test-nya placeholder);
      # hanya backend yang dijalankan.
      - name: Test backend
        run: npm run test -w apps/backend
